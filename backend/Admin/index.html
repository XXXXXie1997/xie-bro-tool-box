<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>蟹小箱 · 管理后台</title><link rel="stylesheet" href="/admin/style.css"><script src="/admin/app.js" defer></script></head>
<body><header><div class="brand"><span>蟹</span><strong>蟹小箱</strong><small> / 管理后台</small></div><button id="logout" hidden>退出管理会话</button></header><main>
<section id="login"><p class="eyebrow">PLATFORM / ADMIN</p><h1>照看好，小箱里的日常。</h1><p class="muted">仅管理员可进入。请使用独立管理会话登录。</p><form id="login-form"><label>账号<input name="username" type="text" autocomplete="username" required maxlength="64"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><button class="primary">进入后台</button></form></section>
<section id="console" hidden><p class="eyebrow">统一用户 · 模块目录 · 操作审计</p><h1>平台概览</h1><nav><button data-view="users" class="active">用户</button><button data-view="modules">模块</button><button data-view="audit">审计</button><button id="refresh">刷新</button></nav><div class="table-wrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div>
<details id="release-panel" hidden><summary>发布声明式内容模块</summary><p class="muted">当前安装器支持 JSON 内容页面。原生工具和跨进程运行协议仍待接入。模块包须包含 module.json 与入口文件，校验值来自已审核的发布包。</p><form id="release-form"><label>模块 ID<input name="id" required pattern="[a-z][a-z0-9-]{0,63}" maxlength="64"></label><label>名称<input name="name" required maxlength="40"></label><label>版本<input name="version" value="0.1.0" required></label><label>介绍<input name="description" required maxlength="1000"></label><label>下载地址（HTTPS；本地开发允许回环 HTTP）<input name="packageUrl" type="url" required></label><label>SHA-256<input name="sha256" required pattern="[a-fA-F0-9]{64}" maxlength="64"></label><button class="primary">保存发布信息</button></form></details>
</section>
<p id="feedback" role="status"></p></main><footer>蟹小箱 / 0.1 开发预览 · 管理凭证只保留在当前页面内存中</footer></body></html>
